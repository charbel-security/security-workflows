name: 🔔 Push Activity Alert (Reusable)

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK:
        required: true

permissions: {}

jobs:
  push-alert:
    name: Push Activity Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Discord push alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook = os.environ.get('DISCORD_WEBHOOK', '')
          if not webhook:
              raise SystemExit('DISCORD_WEBHOOK is empty or unavailable')
          parts = urllib.parse.urlsplit(webhook)
          if (parts.scheme != 'https' or
                  parts.netloc not in ('discord.com', 'discordapp.com') or
                  not re.fullmatch(r'/api(?:/v\d+)?/webhooks/\d+/[^/]+', parts.path)):
              raise SystemExit('DISCORD_WEBHOOK must be a Discord HTTPS webhook URL')
          if os.environ.get('GITHUB_EVENT_NAME') != 'push':
              raise SystemExit('Push alert must be called by a push event')

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)

          def clean(value, limit):
              value = re.sub(r'[\x00-\x1f\x7f]+', ' ', str(value or '')).strip()
              return value if len(value) <= limit else value[:limit - 1] + '…'

          repository = os.environ['GITHUB_REPOSITORY']
          actor = clean(os.environ.get('GITHUB_ACTOR'), 100)
          ref = clean(event.get('ref') or os.environ.get('GITHUB_REF'), 200)
          action = ('deleted' if event.get('deleted') else
                    'created' if event.get('created') else
                    'force-pushed' if event.get('forced') else 'updated')
          candidate = event.get('before') if event.get('deleted') else event.get('after')
          sha = (candidate if isinstance(candidate, str) and
                 re.fullmatch(r'[0-9a-fA-F]{40}', candidate) and
                 candidate != '0' * 40 else 'unknown')
          head = event.get('head_commit') or {}
          message = clean(head.get('message') or '(no head commit)', 500)
          run_url = f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          compare = event.get('compare') or ''
          compare_parts = urllib.parse.urlsplit(compare)
          compare_url = (compare if compare_parts.scheme == 'https'
                         and compare_parts.netloc == 'github.com'
                         and compare_parts.path.startswith(f'/{repository}/compare/')
                         else run_url)
          detected_at = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          content = '\n'.join([
              '🚨 GitHub push activity',
              f'Repository: {repository}',
              f'Actor: {actor}',
              f'Ref: {ref} ({action})',
              f'Commit: {sha}',
              f'Message: {message}',
              f'Compare: {compare_url}',
              f'Workflow run: {run_url}',
              f'Detected: {detected_at}',
              'Investigate if this push was not authorized.',
          ])
          if len(content) > 1900:
              content = content[:1899] + '…'

          query = dict(urllib.parse.parse_qsl(parts.query, keep_blank_values=True))
          query['wait'] = 'true'
          url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path,
                                        urllib.parse.urlencode(query), ''))
          payload = json.dumps({
              'content': content,
              'allowed_mentions': {'parse': []},
          }).encode('utf-8')
          request = urllib.request.Request(
              url, data=payload, headers={'Content-Type': 'application/json'},
              method='POST')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for attempt in range(3):
              try:
                  with opener.open(request, timeout=15) as response:
                      if not 200 <= response.status < 300:
                          raise SystemExit(f'Discord alert failed (HTTP {response.status})')
                  break
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                      raise SystemExit(f'Discord alert failed (HTTP {error.code})') from None
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 2:
                      raise SystemExit('Discord alert failed (network error)') from None
              time.sleep(2 ** attempt)
          print(f'Push alert delivered for {repository} ({action}); run: {run_url}')
          PY
