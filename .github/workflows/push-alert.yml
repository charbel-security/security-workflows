name: 🔔 Push Activity Alert (Reusable)

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK:
        required: true

permissions: {}

jobs:
  push-alert:
    name: Push Activity Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one Discord push alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import unicodedata

          webhook = os.environ.get('DISCORD_WEBHOOK', '')
          if not webhook:
              raise SystemExit('DISCORD_WEBHOOK is empty or unavailable')
          parts = urllib.parse.urlsplit(webhook)
          if (parts.scheme != 'https' or
                  parts.netloc not in ('discord.com', 'discordapp.com') or
                  not re.fullmatch(r'/api(?:/v\d+)?/webhooks/\d+/[^/]+', parts.path)):
              raise SystemExit('DISCORD_WEBHOOK must be a Discord HTTPS webhook URL')
          if os.environ.get('GITHUB_EVENT_NAME') != 'push':
              raise SystemExit('Push alert must be called by a push event')

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)

          def clean(value, limit):
              value = ''.join(ch for ch in str(value or '')
                              if unicodedata.category(ch) != 'Cf')
              value = re.sub(r'[\x00-\x1f\x7f]+', ' ', value).strip()
              return value if len(value) <= limit else value[:limit - 1] + '…'

          def markdown(value, limit):
              value = clean(value, limit)
              for marker in '\\*_~|>[]()#<' + chr(96):
                  value = value.replace(marker, '\\' + marker)
              return value

          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('Unexpected repository name')
          actor = clean(os.environ.get('GITHUB_ACTOR'), 80)
          ref = event.get('ref') or os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/heads/'):
              kind, ref_name = 'branch', ref[len('refs/heads/'):]
          elif ref.startswith('refs/tags/'):
              kind, ref_name = 'tag', ref[len('refs/tags/'):]
          else:
              kind, ref_name = 'ref', ref
          action = ('deleted' if event.get('deleted') else
                    'created' if event.get('created') else
                    'force-pushed' if event.get('forced') else 'updated')

          def valid_sha(value):
              return (isinstance(value, str) and
                      re.fullmatch(r'[0-9a-fA-F]{40}', value) and
                      value != '0' * 40)

          before, after = event.get('before'), event.get('after')
          candidate = before if event.get('deleted') else after
          sha = candidate if valid_sha(candidate) else None
          head = event.get('head_commit') or {}
          message = head.get('message') or '(No head commit in this push event)'
          base_url = f'https://github.com/{repository}'
          run_url = f"{base_url}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          diff_url = (f'{base_url}/compare/{before}...{after}'
                      if valid_sha(before) and valid_sha(after) else None)
          commit_value = f'[{sha[:7]}]({base_url}/commit/{sha})' if sha else 'Unavailable'
          review_value = f'[View diff]({diff_url}) · [Workflow run]({run_url})' if diff_url else f'[Workflow run]({run_url})'
          detected_at = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          embed = {
              'title': f'🚨 {kind.title()} {action} · {repository}',
              'url': diff_url or run_url,
              'color': 0xED4245 if action in ('deleted', 'force-pushed') else 0xF59E0B,
              'fields': [
                  {'name': 'Ref', 'value': f'{kind.title()} · {markdown(ref_name, 180)}', 'inline': True},
                  {'name': 'Pushed by', 'value': f'[{markdown(actor, 80)}](https://github.com/{urllib.parse.quote(actor, safe="")})', 'inline': True},
                  {'name': 'Commit', 'value': commit_value, 'inline': True},
                  {'name': 'Message', 'value': markdown(message, 300) or '(No commit message)', 'inline': False},
                  {'name': 'Review', 'value': review_value, 'inline': False},
              ],
              'footer': {'text': 'GitHub push alert · Investigate unexpected activity'},
              'timestamp': detected_at,
          }
          query = dict(urllib.parse.parse_qsl(parts.query, keep_blank_values=True))
          query['wait'] = 'true'
          url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path,
                                        urllib.parse.urlencode(query), ''))
          payload = json.dumps({
              'embeds': [embed],
              'allowed_mentions': {'parse': []},
          }).encode('utf-8')
          request = urllib.request.Request(
              url, data=payload, headers={'Content-Type': 'application/json', 'User-Agent': 'DiscordBot (https://github.com/charbel-security/security-workflows, 1.0)'},
              method='POST')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          for attempt in range(2):
              try:
                  with opener.open(request, timeout=15) as response:
                      if response.status != 200 or not json.load(response).get('id'):
                          raise SystemExit('Discord did not confirm message creation')
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 429 or attempt:
                      raise SystemExit(f'Discord alert failed (HTTP {error.code})') from None
                  try:
                      delay = float(error.headers.get('Retry-After', '1'))
                  except ValueError:
                      delay = 1
                  time.sleep(min(max(delay, 1), 30))
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit('Discord alert failed (network error)') from None
          print(f'Discord confirmed push alert for {repository} ({action}); run: {run_url}')
          PY
