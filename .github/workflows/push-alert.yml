name: 🔔 Push Activity Alert (Reusable)

# ---------------------------------------------------------------
# This workflow is reusable across any repo inside your org.
# To call it, use:
#
# jobs:
#   call-push-alert:
#     uses: charbel-security/security-workflows/.github/workflows/push-alert.yml@main
#     secrets:
#       DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
# ---------------------------------------------------------------

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK:
        required: true

jobs:
  push-alert:
    name: Push Activity Monitor
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------
      # 1. Log push information to the Actions console
      # -----------------------------------------------------------
      - name: Log push details
        run: |
          echo "🔍 Push Detected!"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Commit Message: ${{ github.event.head_commit.message }}"
          echo "Compare URL: ${{ github.event.compare }}"
          echo "Pusher: ${{ github.event.pusher.name }} <${{ github.event.pusher.email }}>"
          echo "Author: ${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>"
          echo "Commit Timestamp: ${{ github.event.head_commit.timestamp }}"
          echo "Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Triggered By: ${{ github.event.sender.html_url }}"
          echo "UTC Timestamp: $(date -u)"
          echo ""
          echo "If you did not authorize this push, investigate immediately."

      # -----------------------------------------------------------
      # 2. Send Discord alert
      # -----------------------------------------------------------
      - name: Send Discord alert
        if: always()
        uses: Ilshidur/action-discord@0.4.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            🚨 **PUSH DETECTED — `${{ github.repository }}`**
            ───────────────────────────────
            **🧑‍💻 Actor:** `${{ github.actor }}`
            **🌿 Branch:** `${{ github.ref_name }}`
            **💬 Commit:** `${{ github.sha }}`
            **🕒 Commit Time (UTC):** `${{ github.event.head_commit.timestamp }}`
            **🧠 Author:** `${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>`
            **📨 Pusher:** `${{ github.event.pusher.name }} <${{ github.event.pusher.email }}>`
            **💬 Message:** `${{ github.event.head_commit.message }}`
            **🔗 Compare:** [View Diff](${{ github.event.compare }})
            **📄 Workflow Run:** [View Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **🌐 Triggered By:** [${{ github.event.sender.login }}](${{ github.event.sender.html_url }})
            **⏱️ Detected At (UTC):** $(date -u)
            ───────────────────────────────
            ⚠️ *Investigate immediately if this push was not authorized.*

      # -----------------------------------------------------------
      # 3. Archive raw event data for forensic review
      # -----------------------------------------------------------
      - name: Save event payload
        run: |
          mkdir -p artifacts
          echo '${{ toJson(github.event) }}' > artifacts/push_event.json
        continue-on-error: true

      - name: Upload push metadata
        uses: actions/upload-artifact@v4
        with:
          name: push_event_metadata
          path: artifacts/push_event.json

      # -----------------------------------------------------------
      # 4. Optional confirmation message
      # -----------------------------------------------------------
      - name: Send success confirmation
        if: success()
        uses: Ilshidur/action-discord@0.4.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            ✅ **Push Alert Executed — `${{ github.repository }}`**
            **Branch:** `${{ github.ref_name }}`
            **Actor:** `${{ github.actor }}`
            **Time (UTC):** $(date -u)
            Workflow executed successfully and metadata was archived.
